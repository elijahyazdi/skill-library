<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Manrope:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
  :root {
    --page: #f8f9fa;
    --sheet: #ffffff;
    --tint: #eef0f4;
    --ink: #14161a;
    --ink-2: #4e545f;
    --ink-3: #838a95;
    --rule: #dfe2e8;
    --rule-hair: #eaedf1;
    --indigo: #31356b;
    --indigo-wash: #e6e7f1;
    --clay: #9c5a44;
    --clay-wash: #f2e8e4;
    --green: #3d6046;
    --display: "Young Serif", Iowan Old Style, Georgia, serif;
    --body: "Manrope", system-ui, -apple-system, sans-serif;
    --data: "Roboto Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #12141a;
      --sheet: #191c23;
      --tint: #20242c;
      --ink: #e7e9ee;
      --ink-2: #a4abb6;
      --ink-3: #737b87;
      --rule: #282d36;
      --rule-hair: #21252c;
      --indigo: #9ba1de;
      --indigo-wash: #1d2033;
      --clay: #cf9077;
      --clay-wash: #2a211d;
      --green: #86ac91;
    }
  }
  :root[data-theme="dark"] {
    --page: #12141a; --sheet: #191c23; --tint: #20242c;
    --ink: #e7e9ee; --ink-2: #a4abb6; --ink-3: #737b87;
    --rule: #282d36; --rule-hair: #21252c;
    --indigo: #9ba1de; --indigo-wash: #1d2033;
    --clay: #cf9077; --clay-wash: #2a211d; --green: #86ac91;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 400 14.5px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; border-radius: 3px; }
  .kicker { font: 600 11px var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
  .fig { font-family: var(--data); font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 40px; }

  /* ---------------------------------------------------------- thesis */
  .thesis { padding: 62px 0 44px; border-bottom: 1px solid var(--rule); }
  .thesis .claim {
    margin: 0; max-width: 26ch; font: 400 clamp(30px, 4.6vw, 52px)/1.14 var(--display);
    letter-spacing: -0.024em;
    text-wrap: balance;
  }
  .thesis .claim b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--clay); }
  .thesis .claim i { font-style: normal; color: var(--ink-3); }
  .thesis .after { display: flex; gap: 44px; flex-wrap: wrap; margin-top: 30px; align-items: flex-start; }
  .thesis .after p { margin: 0; max-width: 48ch; color: var(--ink-2); font-size: 15px; }
  .thesis .ledger { font-size: 13px; color: var(--ink-3); line-height: 1.85; white-space: nowrap; }
  .thesis .ledger b { font-family: var(--data); color: var(--ink-2); font-weight: 500;
                      font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------- controls */
  .desk { position: sticky; top: 0; z-index: 20; background: var(--page);
          border-bottom: 1px solid var(--rule); }
  .desk .inner { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap;
                 padding: 13px 40px; max-width: 1240px; margin: 0 auto; }
  .look { flex: 0 1 260px; position: relative; }
  .look input { width: 100%; font: 400 14px var(--body); color: var(--ink); background: var(--sheet);
                border: 1px solid var(--rule); border-radius: 999px; padding: 8px 14px 8px 34px;
                transition: border-color 160ms, box-shadow 160ms; }
  .look input::placeholder { color: var(--ink-3); }
  .look input:focus { outline: none; border-color: var(--indigo);
                      box-shadow: 0 0 0 3px var(--indigo-wash); }
  .look svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
              width: 14px; height: 14px; color: var(--ink-3); }
  .opt { display: inline-flex; align-items: center; gap: 7px; }
  select { font: 500 13px var(--body); color: var(--ink); background: var(--sheet);
           border: 1px solid var(--rule); border-radius: 999px; padding: 6px 12px; cursor: pointer;
           transition: border-color 160ms; }
  select:hover:not(:disabled) { border-color: var(--ink-3); }
  select:disabled { color: var(--ink-3); background: var(--tint); cursor: not-allowed; }
  .opt.mute { opacity: 0.55; }
  .tick { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
  .tick input { accent-color: var(--indigo); margin: 0; }
  .push { flex: 1 1 auto; }
  .tailgroup { display: flex; align-items: center; gap: 16px; margin-left: auto; }
  .count { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pair { display: inline-flex; gap: 3px; background: var(--tint); border-radius: 999px; padding: 3px; }
  .pair button { all: unset; cursor: pointer; font: 600 12px var(--body); color: var(--ink-3);
                 padding: 5px 14px; border-radius: 999px; transition: color 160ms, background-color 160ms; }
  .pair button:hover { color: var(--ink); }
  .pair button[aria-pressed="true"] { background: var(--sheet); color: var(--ink);
                                      box-shadow: 0 1px 2px rgba(0,0,0,.07); }

  /* ---------------------------------------------------------- index (table) */
  .index { padding: 8px 40px 100px; max-width: 1240px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; }
  thead th { position: sticky; top: 53px; z-index: 10; background: var(--page); text-align: left;
             font: 600 11px var(--body); letter-spacing: 0.09em; text-transform: uppercase;
             color: var(--ink-3); padding: 14px 12px 9px; border-bottom: 1px solid var(--rule);
             cursor: pointer; user-select: none; white-space: nowrap; transition: color 150ms; }
  thead th:hover { color: var(--ink-2); }
  thead th[aria-sort] { color: var(--ink); }
  .kd { display: block; font-size: 11.5px; color: var(--ink-3); letter-spacing: 0; }
  .kd.any { font-style: italic; opacity: .7; }
  th.r, td.r { text-align: right; }
  tbody tr.item { cursor: pointer; }
  tbody tr.item > td { height: 34px; padding: 0 12px; border-bottom: 1px solid var(--rule-hair);
                       white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                       transition: background-color 140ms; }
  tbody tr.item:hover > td { background: var(--sheet); }
  tbody tr.item.shown > td { background: var(--sheet); border-bottom-color: transparent; }
  td.title { font-weight: 600; font-size: 14.5px; max-width: 310px; letter-spacing: -0.008em; }
  td.gloss { color: var(--ink-2); max-width: 1px; width: 42%; font-size: 13.5px; }
  td.stat { color: var(--ink-2); font-size: 13px; }
  .pip { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  .pip.used { background: var(--green); } .pip.never_used { background: var(--clay); }
  .pip.no_data { background: var(--ink-3); opacity: 0.4; }
  .badge { font: 600 10.5px var(--body); letter-spacing: 0.05em; text-transform: uppercase;
           padding: 2px 7px; border-radius: 999px; margin-left: 8px; white-space: nowrap;
           border: 1px solid var(--rule); color: var(--ink-2); }
  .badge.ind { color: var(--indigo); border-color: color-mix(in srgb, var(--indigo) 40%, var(--rule));
               background: var(--indigo-wash); }
  .badge.cly { color: var(--clay); border-color: color-mix(in srgb, var(--clay) 40%, var(--rule));
               background: var(--clay-wash); }

  tr.entry > td { padding: 0; background: var(--sheet); border-bottom: 1px solid var(--rule); }
  .entry-in { padding: 10px 12px 28px; display: grid; gap: 22px 44px;
              grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
              animation: rise 210ms cubic-bezier(.16,.84,.28,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .entry-in { animation: none; } }
  .entry-in .read { grid-column: 1 / -1; margin: 0; max-width: 68ch; font-size: 15.5px; line-height: 1.6; }
  .entry-in dl { margin: 0; display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 8px 16px; font-size: 13.5px; }
  .entry-in dt { font: 600 10.5px var(--body); letter-spacing: 0.08em; text-transform: uppercase;
                 color: var(--ink-3); padding-top: 4px; }
  .entry-in dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .entry-in .loc { font-family: var(--data); font-size: 12.5px; color: var(--ink-2); user-select: all; }
  .links { display: flex; flex-wrap: wrap; gap: 5px; }
  .links span { font-family: var(--data); font-size: 12px; padding: 2px 7px; border-radius: 999px;
                border: 1px solid var(--rule); color: var(--ink-2); }

  /* ---------------------------------------------------------- entries (cards) */
  .plates { padding: 30px 40px 100px; max-width: 1240px; margin: 0 auto; }
  .band { margin-bottom: 42px; }
  .band > header { display: flex; align-items: baseline; gap: 14px; padding-bottom: 4px;
                   border-bottom: 1px solid var(--rule); margin-bottom: 18px; }
  .band > header h2 { margin: 0; font: 400 22px/1.2 var(--display); letter-spacing: -0.016em; }
  .band > header .n { font-family: var(--data); font-size: 13px; color: var(--ink-3);
                      font-variant-numeric: tabular-nums; }
  .band > header p { margin: 0 0 0 auto; max-width: 46ch; text-align: right; font-size: 12.5px; color: var(--ink-3); }
  .set { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(296px, 1fr)); }
  .plate { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px;
           padding: 18px 19px 15px; cursor: pointer; display: flex; flex-direction: column; gap: 10px;
           min-height: 172px; transition: border-color 170ms, transform 170ms cubic-bezier(.16,.84,.28,1); }
  .plate:hover { border-color: var(--indigo); transform: translateY(-3px); }
  @media (prefers-reduced-motion: reduce) { .plate:hover { transform: none; } }
  .plate h3 { margin: 0; font: 600 16px/1.25 var(--body); letter-spacing: -0.012em; text-wrap: balance; }
  .plate .sub { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
  .plate p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-2);
             overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; line-clamp: 4;
             -webkit-box-orient: vertical; }
  .plate .tail { margin-top: auto; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .plate .tail .u { margin-left: auto; font-family: var(--data); font-size: 12px; color: var(--ink-3); }

  .empty { padding: 90px 40px; max-width: 1240px; margin: 0 auto; }
  .empty h2 { margin: 0 0 10px; font: 400 26px/1.2 var(--display); letter-spacing: -0.018em; max-width: 22ch; }
  .empty p { margin: 0 0 20px; color: var(--ink-2); max-width: 52ch; }
  .empty button { all: unset; cursor: pointer; font: 600 13px var(--body); color: var(--sheet);
                  background: var(--indigo); border-radius: 999px; padding: 9px 18px; }
  .colophon { border-top: 1px solid var(--rule); }
  .colophon .inner { max-width: 1240px; margin: 0 auto; padding: 22px 40px 44px;
                     font-size: 12.5px; color: var(--ink-3); max-width: 70ch; }

  @media (max-width: 760px) {
    .wrap, .desk .inner, .index, .plates, .empty, .colophon .inner { padding-left: 20px; padding-right: 20px; }
    .entry-in { grid-template-columns: 1fr; }
    .band > header p { display: none; }
    td.gloss, td.stat { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script id="snapshot" type="application/json">__SNAPSHOT_JSON__</script>
<script>
const SNAP = JSON.parse(document.getElementById('snapshot').textContent);
const ALL = SNAP.entries;
const qp = new URLSearchParams(location.search);

const F = {
  mode: qp.get('mode') === 'entries' ? 'entries' : 'index',
  q: '', wide: true, source: 'global', usage: 'all', role: 'all',
  domain: 'all', kind: 'all',
  sort: 'age', dir: 'desc', open: null,
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = e => e.usage.state;
const WORD = { used: 'in use', never_used: 'never used', no_data: 'no record' };
const age = e => e.usage.days_since_last_use;
const isLeaf = e => e.reached_via.length && !e.delegates_to.length;
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
// A null domain means universal, not unknown (001). Filtering to a real domain keeps
// those skills in view — dimmed — because hiding `grilling` from every domain makes it
// unfindable. `any` filters to them alone.
const ANY = 'Any';
const DOMAIN = e => e.domain || ANY;
const facet = key => [...new Set(ALL.map(key))].sort((a, b) =>
  a === ANY ? 1 : b === ANY ? -1 : a.localeCompare(b));
const ORIGIN = e => e.plugin ? e.plugin.split('@')[0] : e.source === 'global' ? 'yours' : e.source;
const ageText = e => age(e) == null ? WORD[state(e)] : (age(e) === 0 ? 'used today' : age(e) + 'd ago');

function pool() {
  const q = F.q.trim().toLowerCase();
  return ALL.filter(e => {
    if (F.source !== 'all' && e.source !== F.source) return false;
    if (F.usage !== 'all' && state(e) !== F.usage) return false;
    if (F.role === 'orchestrator' && !e.orchestration_verdict) return false;
    if (F.role === 'leaf' && !isLeaf(e)) return false;
    // Universal joins every domain except Platform, which is a provenance bucket rather
    // than a kind of work: `xlsx` serves marketing, it does not serve "Platform".
    if (F.domain === 'any' ? e.domain
        : F.domain !== 'all' && (e.domain ? e.domain !== F.domain : F.domain === 'Platform')) return false;
    if (F.kind !== 'all' && e.kind !== F.kind) return false;
    if (!q) return true;
    return e.id.toLowerCase().includes(q) ||
           (F.wide && (e.description || '').toLowerCase().includes(q));
  });
}

const KEY = {
  title: e => e.name.toLowerCase(), gloss: e => (e.description || '').toLowerCase(),
  // The tool opens on this. A proven never-used skill is maximally neglected, not missing:
  // ranking it null would drop the whole headline claim to the bottom of the table. A no_data
  // skill really is unknown, so it keeps null and sorts last in both directions.
  age: e => state(e) === 'never_used' ? Infinity : age(e),
  uses: e => e.usage.total_count, calls: e => e.orchestration_degree || null,
  kind: e => (e.kind || '').toLowerCase(),
  origin: e => ORIGIN(e).toLowerCase(), size: e => e.body_lines,
};
function ordered(rows) {
  const get = KEY[F.sort], sign = F.dir === 'asc' ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const x = get(a), y = get(b);
    if (x == null && y == null) return a.name.localeCompare(b.name);
    if (x == null) return 1;                 // absence ranks last in both directions
    if (y == null) return -1;
    if (typeof x === 'string') return sign * x.localeCompare(y) || a.name.localeCompare(b.name);
    return sign * (x - y) || a.name.localeCompare(b.name);
  });
}

// ---------------------------------------------------------------- thesis
function thesis() {
  const c = SNAP.counts, u = SNAP.usage_sources;
  const mine = ALL.filter(e => e.source === 'global');
  const never = mine.filter(e => state(e) === 'never_used').length;
  const leaves = ALL.filter(isLeaf).length;
  const d = Math.max(0, Math.round((Date.now() - Date.parse(SNAP.snapshot_generated_at)) / 864e5));
  return `<div class="wrap"><div class="thesis">
    <span class="kicker">Skill field guide</span>
    <p class="claim">Of the <b>${mine.length}</b> skills you wrote, <b>${never}</b> have
      never once been called.</p>
    <div class="after">
      <p>That is measured against ${u.history.record_count.toLocaleString()} command records going
        back to ${(u.history.window_start || '').slice(0, 7)} — long enough that silence means
        something. Another ${leaves} skills across the library are reachable only when an
        orchestrator names them, so their descriptions never have to work.</p>
      <div class="ledger">
        <div><b>${c.entries}</b> skills catalogued</div>
        <div><b>${c.plugin}</b> arrived with plugins</div>
        <div><b>${u.transcripts.file_count}</b> transcripts read, <b>${u.transcripts.retention_days}</b>d kept</div>
        <div>Scanned ${d === 0 ? 'today' : plural(d, 'day') + ' ago'}</div>
      </div>
    </div>
  </div></div>`;
}

function desk(n) {
  const opt = (v, l, cur) => `<option value="${v}"${cur === v ? ' selected' : ''}>${l}</option>`;
  return `<div class="desk"><div class="inner">
    <div class="look">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="6" cy="6" r="4"/><path d="M9 9l4 4"/></svg>
      <input id="q" type="search" value="${esc(F.q)}" autocomplete="off"
        placeholder="Look up ${F.wide ? 'names and glosses' : 'names'}" aria-label="Look up a skill">
    </div>
    <label class="tick"><input type="checkbox" id="wide"${F.wide ? ' checked' : ''}>Glosses</label>
    <span class="opt"><span class="kicker">From</span><select id="source">
      ${opt('global', 'Yours', F.source)}${opt('plugin', 'Plugins', F.source)}${opt('repo', 'Repo', F.source)}${opt('all', 'Everything', F.source)}
    </select></span>
    <span class="opt"><span class="kicker">Role</span><select id="role">
      ${opt('all', 'Any', F.role)}${opt('orchestrator', 'Orchestrators', F.role)}${opt('leaf', 'Reached only via', F.role)}
    </select></span>
    <span class="opt"><span class="kicker">Domain</span><select id="domain">
      ${opt('all', 'Any domain', F.domain)}${facet(DOMAIN).map(d =>
        d === ANY ? opt('any', 'Universal only', F.domain) : opt(d, d, F.domain)).join('')}
    </select></span>
    <span class="opt"><span class="kicker">Kind</span><select id="kind">
      ${opt('all', 'Any kind', F.kind)}${facet(e => e.kind).map(k => opt(k, k, F.kind)).join('')}
    </select></span>
    <span class="push"></span>
    <div class="tailgroup">
    <span class="count">${n === ALL.length ? plural(n, 'skill') : n + ' of ' + ALL.length}</span>
    <div class="pair" role="group" aria-label="Layout">
      <button data-mode="index" aria-pressed="${F.mode === 'index'}">Index</button>
      <button data-mode="entries" aria-pressed="${F.mode === 'entries'}">Entries</button>
    </div></div>
  </div></div>`;
}

// ---------------------------------------------------------------- index
const COLS = [['title', 'Skill', ''], ['gloss', 'Gloss', ''], ['age', 'Last used', 'r'],
              ['uses', 'Uses', 'r'], ['calls', 'Calls', 'r'], ['origin', 'From', ''],
              ['kind', 'Kind', ''], ['size', 'Lines', 'r']];
// Kind sorts by kind then domain, since the cell shows both.

function indexView(rows) {
  const head = COLS.map(([k, l, cls]) => {
    const on = F.sort === k;
    return `<th data-sort="${k}" class="${cls}"${on ? ` aria-sort="${F.dir === 'asc' ? 'ascending' : 'descending'}"` : ''}>${l}${on ? (F.dir === 'asc' ? ' ↑' : ' ↓') : ''}</th>`;
  }).join('');
  const body = rows.map(e => {
    const on = F.open === e.id;
    const badges = [
      e.orchestration_verdict ? '<span class="badge ind">orchestrator</span>' : '',
      isLeaf(e) ? '<span class="badge cly">reached only via</span>' : '',
    ].filter(Boolean).join('');
    const row = `<tr class="item${on ? ' shown' : ''}" data-id="${esc(e.id)}" tabindex="0"
        role="button" aria-expanded="${on}">
      <td class="title"><span class="pip ${state(e)}" title="${WORD[state(e)]}"></span>${esc(e.name)}${badges}</td>
      <td class="gloss">${esc(e.description || '')}</td>
      <td class="stat r fig">${age(e) == null ? '—' : (age(e) === 0 ? 'today' : age(e) + 'd')}</td>
      <td class="stat r fig">${e.usage.total_count ?? '—'}</td>
      <td class="stat r fig">${e.orchestration_degree || '—'}</td>
      <td class="stat">${esc(ORIGIN(e))}</td>
      <td class="stat">${esc(e.kind || '—')}<span class="kd${e.domain ? '' : ' any'}">${esc(DOMAIN(e))}</span></td>
      <td class="stat r fig">${e.body_lines}</td></tr>`;
    return on ? row + entry(e) : row;
  }).join('');
  return `<div class="index"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function entry(e) {
  const u = e.usage;
  const links = list => list.length
    ? `<span class="links">${list.map(x => `<span>${esc(x)}</span>`).join('')}</span>`
    : '<span style="color:var(--ink-3)">—</span>';
  const chan = [['tool_calls', 'called as a tool'], ['injections', 'injected by a hook'],
                ['slash_commands', 'typed as a command']].filter(([k]) => u[k])
    .map(([k, l]) => `${l} ×${u[k]}`).join(' · ');
  const notes = [
    e.has_resources && 'bundles resources', !e.model_invocable && 'not model-invocable',
    e.repo_differs && 'repo copy has drifted', e.parse_status !== 'ok' && 'frontmatter ' + e.parse_status,
    e.is_symlink && 'symlinked',
  ].filter(Boolean);

  return `<tr class="entry"><td colspan="${COLS.length}"><div class="entry-in">
    <p class="read">${esc(e.description || 'No gloss on record.')}</p>
    <dl>
      <dt>Call it</dt><dd class="loc">/${esc(e.id)}</dd>
      <dt>Lives at</dt><dd class="loc">${esc(e.skill_file)}</dd>
      <dt>Category</dt><dd>${esc(DOMAIN(e))}${e.domain_secondary ? ' · ' + esc(e.domain_secondary) : ''} / ${esc(e.kind || '—')}
        <span style="color:var(--ink-3)">${e.category_source === 'llm' ? 'inferred, correctable' : esc(e.category_source)}</span></dd>
      ${e.orchestration_class ? `<dt>Adjudged</dt><dd>${esc(e.orchestration_class)}
        <span style="color:var(--ink-3)">${esc(e.orchestration_reason || '')}</span></dd>` : ''}
      <dt>Written by</dt><dd>${esc(e.author)} <span style="color:var(--ink-3)">via ${esc(e.author_source)}</span></dd>
      <dt>Version</dt><dd>${e.version ? esc(e.version) : '<span style="color:var(--ink-3)">unknown</span>'}${e.updated_at ? ', updated ' + esc(e.updated_at.slice(0, 10)) : ''}</dd>
      ${e.upstream_url ? `<dt>Upstream</dt><dd class="loc">${esc(e.upstream_url)}</dd>` : ''}
      <dt>Notes</dt><dd>${notes.length ? esc(notes.join(' · ')) : '<span style="color:var(--ink-3)">—</span>'}</dd>
    </dl>
    <dl>
      <dt>Record</dt><dd><span class="pip ${state(e)}"></span>${WORD[state(e)]}${u.total_count != null ? `, ${plural(u.total_count, 'use')}` : ''}</dd>
      <dt>Evidence</dt><dd>${chan || `<span style="color:var(--ink-3)">nothing in ${u.coverage === 'full_history' ? '167 days of history' : 'the 30-day transcript window'}</span>`}</dd>
      ${u.attribution === 'ambiguous' ? `<dt>Caveat</dt><dd>Shares this count with
        ${links(u.attribution_candidates.filter(c => c !== e.id))} — hook injections drop the plugin
        prefix, so it cannot be split.</dd>` : ''}
      <dt>Calls</dt><dd>${links(e.delegates_to)}</dd>
      <dt>Called by</dt><dd>${links(e.reached_via)}</dd>
      ${e.delegates_to_unresolved.length ? `<dt>Unresolved</dt><dd>${links(e.delegates_to_unresolved)}</dd>` : ''}
    </dl>
  </div></td></tr>`;
}

// ---------------------------------------------------------------- entries
const BANDS = [
  ['never_used', 'Never called', 'Zero invocations in the whole history window. The only defensible “never”.'],
  ['dormant', 'Gone quiet', 'Called at least once, but not in the last month.'],
  ['used', 'In rotation', 'Called within the last month.'],
  ['no_data', 'No record', 'The only channel that could see these is the 30-day transcript window.'],
];
function bandOf(e) {
  const s = state(e);
  if (s !== 'used') return s;
  return (age(e) ?? 0) >= 30 ? 'dormant' : 'used';
}

function entriesView(rows) {
  const groups = {};
  rows.forEach(e => { (groups[bandOf(e)] = groups[bandOf(e)] || []).push(e); });
  return `<div class="plates">${BANDS.filter(([k]) => groups[k]?.length).map(([k, title, why]) => `
    <section class="band">
      <header><h2>${title}</h2><span class="n">${groups[k].length}</span><p>${why}</p></header>
      <div class="set">${groups[k].map(e => `<article class="plate" data-id="${esc(e.id)}"
          tabindex="0" role="button" aria-label="${esc(e.name)}">
        <h3>${esc(e.name)}</h3>
        <div class="sub"><span class="pip ${state(e)}"></span>${esc(ageText(e))}</div>
        <p>${esc(e.description || 'No gloss on record.')}</p>
        <div class="tail">
          <span class="badge">${esc(ORIGIN(e))}</span>
          ${e.orchestration_verdict ? '<span class="badge ind">orchestrator</span>' : ''}
          ${isLeaf(e) ? '<span class="badge cly">reached only via</span>' : ''}
          ${e.kind ? `<span class="badge">${esc(e.kind)}</span>` : ''}
          <span class="u">${e.usage.total_count != null ? plural(e.usage.total_count, 'use') : 'no record'}</span>
        </div></article>`).join('')}</div>
    </section>`).join('')}</div>`;
}

function empty() {
  return `<div class="empty">
    <h2>Nothing in the guide matches that</h2>
    <p>${F.q ? `No skill mentions “${esc(F.q)}”` : 'No skill fits those filters'}.
      Glosses are the trigger text a model reads, so looking them up finds more than names alone.</p>
    <button id="reset">Start over</button></div>`;
}

// ---------------------------------------------------------------- render
function render(focus) {
  const rows = ordered(pool());
  document.getElementById('app').innerHTML = thesis() + desk(rows.length) +
    (rows.length ? (F.mode === 'index' ? indexView(rows) : entriesView(rows)) : empty()) +
    colophon();
  wire();
  if (focus) {
    const el = document.getElementById(focus.id);
    if (el) { el.focus(); if (focus.pos != null && el.setSelectionRange) el.setSelectionRange(focus.pos, focus.pos); }
  }
}

function colophon() {
  const c = SNAP.counts, guessed = ALL.filter(e => e.category_source === 'llm').length;
  const universal = ALL.filter(e => !e.domain).length;
  return `<div class="colophon"><div class="inner">Domain and kind are a judgment call, not a
    reading off disk: ${guessed} were inferred one skill at a time and ${c.plugin} were assigned
    Platform by rule. ${universal} carry no domain at all, which means universal, not unknown —
    they stay in view under every domain. Two usage channels leave no trace at all, so a blank
    record is the absence of evidence, not evidence of absence.</div></div>`;
}

function wire() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on('q', 'input', e => { F.q = e.target.value; F.open = null; render({ id: 'q', pos: e.target.selectionStart }); });
  on('wide', 'change', e => { F.wide = e.target.checked; render({ id: 'wide' }); });
  on('source', 'change', e => { F.source = e.target.value; F.open = null; render({ id: 'source' }); });
  on('role', 'change', e => { F.role = e.target.value; F.open = null; render({ id: 'role' }); });
  on('domain', 'change', e => { F.domain = e.target.value; F.open = null; render({ id: 'domain' }); });
  on('kind', 'change', e => { F.kind = e.target.value; F.open = null; render({ id: 'kind' }); });
  on('reset', 'click', () => {
    F.q = ''; F.usage = 'all'; F.role = 'all'; F.source = 'global'; F.domain = 'all'; F.kind = 'all';
    render();
  });

  document.querySelectorAll('thead th[data-sort]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if (F.sort === k) F.dir = F.dir === 'asc' ? 'desc' : 'asc';
    else { F.sort = k; F.dir = ['title', 'gloss', 'origin'].includes(k) ? 'asc' : 'desc'; }
    render();
  }));
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    if (F.mode === b.dataset.mode) return;
    F.mode = b.dataset.mode; F.open = null;
    const p = new URLSearchParams(location.search); p.set('mode', F.mode);
    history.replaceState(null, '', location.pathname + '?' + p);
    render();
  }));
  document.querySelectorAll('[data-id]').forEach(el => {
    const toggle = () => {
      F.open = F.open === el.dataset.id ? null : el.dataset.id;
      if (F.mode === 'entries' && F.open) F.mode = 'index';
      render();
    };
    el.addEventListener('click', toggle);
    el.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
    });
  });
}

addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === '/' && !typing) { e.preventDefault(); document.getElementById('q').focus(); }
  if (e.key === 'Escape') {
    if (F.open) { F.open = null; render(); }
    else if (F.q) { F.q = ''; render({ id: 'q' }); }
  }
});

render();
</script>
</body>
</html>
