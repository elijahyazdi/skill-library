<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #e9e7e0;
    --card: #f7f6f2;
    --card-edge: #dedbd1;
    --ink: #1f2124;
    --ink-2: #5c6066;
    --ink-3: #8b8e93;
    --rule: #cfccc2;
    --rule-hair: #dcd9cf;
    --blue: #2e4a6b;
    --blue-wash: #e2e6ec;
    --oxblood: #8c3a2e;
    --oxblood-wash: #f0e2df;
    --moss: #4a6141;
    --label: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
    --text: "Source Serif 4", Iowan Old Style, Georgia, serif;
    --data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --rail: 132px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1a1b1d;
      --card: #222426;
      --card-edge: #2e3134;
      --ink: #e6e4de;
      --ink-2: #a6a49d;
      --ink-3: #7b7973;
      --rule: #34373a;
      --rule-hair: #2b2e30;
      --blue: #7ea7cf;
      --blue-wash: #232c35;
      --oxblood: #d0836f;
      --oxblood-wash: #2f2422;
      --moss: #92b183;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1a1b1d; --card: #222426; --card-edge: #2e3134;
    --ink: #e6e4de; --ink-2: #a6a49d; --ink-3: #7b7973;
    --rule: #34373a; --rule-hair: #2b2e30;
    --blue: #7ea7cf; --blue-wash: #232c35;
    --oxblood: #d0836f; --oxblood-wash: #2f2422; --moss: #92b183;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 15px/1.55 var(--text);
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .lbl {
    font-family: var(--label); text-transform: uppercase; letter-spacing: 0.09em;
    font-size: 10.5px; font-weight: 600; color: var(--ink-3);
  }
  .num { font-family: var(--data); font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------- thumb rail */
  .rail {
    position: fixed; inset: 0 auto 0 0; width: var(--rail); z-index: 30;
    background: var(--paper); border-right: 1px solid var(--rule);
    display: flex; flex-direction: column; padding: 22px 0 18px;
    overflow-y: auto; scrollbar-width: thin;
  }
  .rail .mark { padding: 0 16px 20px; }
  .rail .mark b { display: block; font-family: var(--label); font-weight: 600; font-size: 15px;
                  letter-spacing: -0.005em; text-transform: none; color: var(--ink); }
  .rail .mark span { display: block; margin-top: 2px; }
  .rail .group { padding: 0 10px; margin-bottom: 16px; }
  .rail .group > .lbl { display: block; padding: 0 6px 6px; }
  .rail button {
    all: unset; display: flex; justify-content: space-between; gap: 8px; width: 100%;
    cursor: pointer; font-family: var(--label); font-size: 12.5px; color: var(--ink-2);
    padding: 3px 6px; border-radius: 3px; transition: color 140ms, background-color 140ms;
  }
  .rail button:hover { color: var(--ink); background: var(--card); }
  .rail button[aria-pressed="true"] { color: var(--ink); background: var(--card);
    box-shadow: inset 2px 0 0 var(--blue); font-weight: 600; }
  .rail button .n { color: var(--ink-3); font-family: var(--data); font-size: 11px;
                    font-variant-numeric: tabular-nums; }
  .rail .alpha { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; padding: 0 14px; }
  .rail .alpha button { justify-content: center; padding: 3px 0; font-size: 11.5px; }
  .rail .alpha button:disabled { color: var(--ink-3); opacity: 0.35; cursor: default; background: none; }

  /* ---------------------------------------------------------- sheet */
  .sheet { margin-left: var(--rail); }
  .head {
    padding: 30px 34px 18px; border-bottom: 2px solid var(--ink);
    display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; flex-wrap: wrap;
  }
  .head h1 { margin: 0; font: 600 27px/1.15 var(--label); letter-spacing: -0.01em;
             text-transform: none; text-wrap: balance; }
  .head p { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; max-width: 62ch; }
  .head p b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stamp { text-align: right; font-family: var(--label); font-size: 11.5px; color: var(--ink-3);
           line-height: 1.75; letter-spacing: 0.02em; }
  .stamp b { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }

  .controls {
    position: sticky; top: 0; z-index: 20; background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 11px 34px; display: flex; align-items: center; gap: 9px 16px; flex-wrap: wrap;
  }
  .find { flex: 0 1 268px; }
  .find input {
    width: 100%; font: 400 14px/1.4 var(--text); color: var(--ink);
    background: transparent; border: 0; border-bottom: 1px solid var(--rule);
    padding: 5px 2px; transition: border-color 150ms;
  }
  .find input::placeholder { color: var(--ink-3); }
  .find input:hover { border-bottom-color: var(--ink-3); }
  .find input:focus { outline: none; border-bottom-color: var(--blue); }
  .pick { display: inline-flex; align-items: baseline; gap: 6px; }
  select {
    font: 400 13px var(--label); color: var(--ink); background: transparent;
    border: 0; border-bottom: 1px solid var(--rule); padding: 4px 2px; cursor: pointer;
  }
  select:hover:not(:disabled) { border-bottom-color: var(--ink-3); }
  select:disabled { color: var(--ink-3); cursor: not-allowed; }
  .pick.off { opacity: 0.5; }
  .swap { display: inline-flex; align-items: center; gap: 6px; font: 400 12px var(--label); color: var(--ink-2); cursor: pointer; }
  .swap input { accent-color: var(--blue); margin: 0; }
  .grow { flex: 1 1 auto; }
  .tally { font-family: var(--data); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .modes { display: inline-flex; border: 1px solid var(--rule); border-radius: 2px; }
  .modes button {
    all: unset; cursor: pointer; font: 500 11px var(--label); text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-3); padding: 5px 11px; transition: color 140ms, background 140ms;
  }
  .modes button + button { border-left: 1px solid var(--rule); }
  .modes button:hover { color: var(--ink); }
  .modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* ---------------------------------------------------------- catalogue rows */
  .rows { padding: 0 34px 90px; }
  .rec {
    display: grid; grid-template-columns: 92px minmax(0, 1fr) auto;
    gap: 0 20px; align-items: baseline;
    padding: 9px 0 9px; border-bottom: 1px solid var(--rule-hair); cursor: pointer;
  }
  .rec:hover { background: var(--card); }
  .rec.on { background: var(--card); border-bottom-color: transparent; }
  .rec .call { font-family: var(--data); font-size: 11.5px; color: var(--ink-3);
               letter-spacing: -0.01em; white-space: nowrap; }
  .rec .ttl { font-family: var(--label); font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
  .rec .ttl .marks { display: inline-flex; gap: 6px; margin-left: 8px; vertical-align: 2px; }
  .rec .abs { grid-column: 2; color: var(--ink-2); font-size: 13.5px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec .when { grid-row: 1 / span 2; grid-column: 3; align-self: center; text-align: right;
               font-family: var(--data); font-size: 12px; color: var(--ink-2); white-space: nowrap;
               font-variant-numeric: tabular-nums; }
  .rec .when i { font-style: normal; display: block; font-family: var(--label);
                 font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  .mark-tag {
    font: 500 10px var(--label); text-transform: uppercase; letter-spacing: 0.07em;
    padding: 1px 5px; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap;
  }
  .mark-tag.blue { color: var(--blue); border-color: var(--blue); background: var(--blue-wash); }
  .mark-tag.ox { color: var(--oxblood); border-color: var(--oxblood); background: var(--oxblood-wash); }

  .card-out {
    border-bottom: 1px solid var(--rule); background: var(--card);
    padding: 4px 0 26px; animation: unfold 220ms cubic-bezier(.16,.84,.28,1);
  }
  @keyframes unfold { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card-out { animation: none; } }
  .card-in {
    margin: 0 0 0 112px; max-width: 92ch; border-left: 1px solid var(--rule);
    padding-left: 24px; display: grid; gap: 18px 36px;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  }
  .card-in .quote { grid-column: 1 / -1; font-size: 15px; line-height: 1.6; max-width: 68ch; margin: 6px 0 0; }
  .card-in dl { margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 14px; font-size: 13px; }
  .card-in dt { font: 600 10.5px var(--label); text-transform: uppercase; letter-spacing: 0.08em;
                color: var(--ink-3); padding-top: 3px; }
  .card-in dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .card-in .path { font-family: var(--data); font-size: 12px; color: var(--ink-2); user-select: all; }
  .refs { display: flex; flex-wrap: wrap; gap: 5px; }
  .ref { font-family: var(--data); font-size: 11.5px; padding: 1px 6px;
         border: 1px solid var(--rule); color: var(--ink-2); }

  /* ---------------------------------------------------------- index cards */
  .deck { padding: 22px 34px 90px; display: grid; gap: 16px;
          grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .idx {
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 2px;
    padding: 0 0 13px; cursor: pointer; display: flex; flex-direction: column;
    min-height: 176px; transition: border-color 160ms, transform 160ms cubic-bezier(.16,.84,.28,1);
  }
  .idx:hover { border-color: var(--ink-3); transform: translateY(-2px); }
  @media (prefers-reduced-motion: reduce) { .idx:hover { transform: none; } }
  .idx .bar { display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
              padding: 8px 15px; border-bottom: 1px solid var(--oxblood); }
  .idx .bar .call { font-family: var(--data); font-size: 11px; color: var(--ink-3); }
  .idx .bar .age { font-family: var(--data); font-size: 11.5px; color: var(--ink-2);
                   font-variant-numeric: tabular-nums; }
  .idx h3 { margin: 13px 15px 6px; font: 600 15.5px/1.25 var(--label); letter-spacing: -0.005em;
            text-wrap: balance; }
  .idx p { margin: 0 15px; font-size: 13.5px; line-height: 1.5; color: var(--ink-2);
           overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; line-clamp: 4;
           -webkit-box-orient: vertical; }
  .idx .foot { margin: auto 15px 0; padding-top: 12px; display: flex; align-items: center;
               gap: 6px; flex-wrap: wrap; }
  .idx .foot .uses { margin-left: auto; font-family: var(--data); font-size: 11.5px; color: var(--ink-3); }

  /* ---------------------------------------------------------- empty */
  .none { padding: 76px 34px; max-width: 48ch; }
  .none h2 { margin: 0 0 8px; font: 600 20px var(--label); letter-spacing: -0.005em; }
  .none p { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; }
  .none button { all: unset; cursor: pointer; font: 500 11px var(--label); text-transform: uppercase;
                 letter-spacing: 0.08em; color: var(--paper); background: var(--ink);
                 padding: 7px 14px; }
  .foot-note { margin-left: var(--rail); padding: 0 34px 34px; font: 400 11.5px var(--label);
               letter-spacing: 0.03em; color: var(--ink-3); }

  @media (max-width: 820px) {
    :root { --rail: 0px; }
    .rail { position: static; width: auto; inset: auto; flex-direction: row; flex-wrap: wrap;
            border-right: 0; border-bottom: 1px solid var(--rule); padding: 16px 20px; gap: 18px; }
    .rail .alpha { display: none; }
    .sheet, .foot-note { margin-left: 0; }
    .head, .controls, .rows, .deck, .none, .foot-note { padding-left: 20px; padding-right: 20px; }
    .card-in { margin-left: 0; }
    .rec { grid-template-columns: minmax(0, 1fr) auto; }
    .rec .call { display: none; }
    .rec .abs { grid-column: 1; }
  }
</style>
</head>
<body>
<nav class="rail" id="rail" aria-label="Index"></nav>
<div class="sheet" id="sheet"></div>
<div class="foot-note" id="note"></div>

<script id="snapshot" type="application/json">__SNAPSHOT_JSON__</script>
<script>
const SNAP = JSON.parse(document.getElementById('snapshot').textContent);
const ALL = SNAP.entries;
const qp = new URLSearchParams(location.search);

const F = {
  mode: qp.get('mode') === 'cards' ? 'cards' : 'rows',
  q: '', wide: true, source: 'global', usage: 'all', role: 'all', letter: null,
  sort: 'age', dir: 'desc', open: null,
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = e => e.usage.state;
const WORD = { used: 'in use', never_used: 'never used', no_data: 'no record' };
const age = e => e.usage.days_since_last_use;
const isLeaf = e => e.reached_via.length && !e.delegates_to.length;
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const ORIGIN = e => e.plugin ? e.plugin.split('@')[0] : e.source === 'global' ? 'yours' : e.source;

// A call number that means something: origin initials, then the skill's size band, then
// the usage state. Sorting by it groups the library the way the shelves would.
function call(e) {
  const o = (e.plugin ? e.plugin.split('@')[0] : e.source).slice(0, 3).toUpperCase();
  const band = String(Math.min(999, Math.round(e.body_lines / 10))).padStart(3, '0');
  return o + '·' + band + { used: 'u', never_used: 'n', no_data: '—' }[state(e)];
}
function ageText(e) {
  const d = age(e);
  if (d == null) return `<i>${WORD[state(e)]}</i>`;
  return `${d === 0 ? 'today' : d + 'd'}<i>since used</i>`;
}

function pool() {
  const q = F.q.trim().toLowerCase();
  return ALL.filter(e => {
    if (F.source !== 'all' && e.source !== F.source) return false;
    if (F.usage !== 'all' && state(e) !== F.usage) return false;
    if (F.role === 'orchestrator' && !e.orchestration_verdict) return false;
    if (F.role === 'leaf' && !isLeaf(e)) return false;
    if (F.letter && e.name[0].toUpperCase() !== F.letter) return false;
    if (!q) return true;
    return e.id.toLowerCase().includes(q) ||
           (F.wide && (e.description || '').toLowerCase().includes(q));
  });
}

const KEY = {
  call: e => call(e), name: e => e.name.toLowerCase(), age: e => age(e),
  uses: e => e.usage.total_count, calls: e => e.orchestration_degree || null,
  size: e => e.body_lines,
};
function ordered(rows) {
  const get = KEY[F.sort], sign = F.dir === 'asc' ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const x = get(a), y = get(b);
    if (x == null && y == null) return a.name.localeCompare(b.name);
    if (x == null) return 1;                       // absence ranks last either way;
    if (y == null) return -1;                      // "unknown" is not a value.
    if (typeof x === 'string') return sign * x.localeCompare(y) || a.name.localeCompare(b.name);
    return sign * (x - y) || a.name.localeCompare(b.name);
  });
}

// ---------------------------------------------------------------- rail
function rail() {
  const c = SNAP.counts;
  const src = [['global', 'Yours', c.global], ['plugin', 'Plugins', c.plugin],
               ['repo', 'Repo', c.repo], ['all', 'Everything', c.entries]];
  const inSource = ALL.filter(e => F.source === 'all' || e.source === F.source);
  const letters = new Set(inSource.map(e => e.name[0].toUpperCase()));
  const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(L =>
    `<button data-letter="${L}" aria-pressed="${F.letter === L}"
      ${letters.has(L) ? '' : 'disabled'}>${L}</button>`).join('');
  const roles = [['all', 'Everything', inSource.length],
                 ['orchestrator', 'Orchestrators', inSource.filter(e => e.orchestration_verdict).length],
                 ['leaf', 'Reached only via', inSource.filter(isLeaf).length]];

  return `<div class="mark"><b>Skill catalogue</b><span class="lbl">Drawer index</span></div>
    <div class="group"><span class="lbl">Drawer</span>
      ${src.map(([v, l, n]) => `<button data-source="${v}" aria-pressed="${F.source === v}">
        <span>${l}</span><span class="n">${n}</span></button>`).join('')}</div>
    <div class="group"><span class="lbl">Role</span>
      ${roles.map(([v, l, n]) => `<button data-role="${v}" aria-pressed="${F.role === v}">
        <span>${l}</span><span class="n">${n}</span></button>`).join('')}</div>
    <div class="group"><span class="lbl">Letter</span>
      <div class="alpha">${alpha}</div>
      ${F.letter ? `<button data-letter="" style="margin-top:8px"><span>Clear ${F.letter}</span></button>` : ''}
    </div>`;
}

// ---------------------------------------------------------------- head
function head() {
  const c = SNAP.counts, u = SNAP.usage_sources;
  const d = Math.max(0, Math.round((Date.now() - Date.parse(SNAP.snapshot_generated_at)) / 864e5));
  const never = ALL.filter(e => state(e) === 'never_used').length;
  return `<header class="head">
    <div>
      <h1>Skill catalogue</h1>
      <p><b>${c.entries}</b> skills catalogued, and <b>${never}</b> of them have never once been
        called. The catalogue points at files; it never edits one.</p>
    </div>
    <div class="stamp">
      <div>Scanned ${d === 0 ? 'today' : plural(d, 'day') + ' ago'}</div>
      <div>Accession from <b>${u.history.record_count.toLocaleString()}</b> command records</div>
      <div>and <b>${u.transcripts.file_count}</b> transcripts, kept <b>${u.transcripts.retention_days}</b> days</div>
    </div>
  </header>`;
}

function controls(n) {
  const opt = (v, l, cur) => `<option value="${v}"${cur === v ? ' selected' : ''}>${l}</option>`;
  return `<div class="controls">
    <div class="find"><input id="q" type="search" value="${esc(F.q)}" autocomplete="off"
      placeholder="Find in ${F.wide ? 'titles and abstracts' : 'titles'}" aria-label="Find a skill"></div>
    <label class="swap"><input type="checkbox" id="wide"${F.wide ? ' checked' : ''}>Abstracts</label>
    <span class="pick"><span class="lbl">Record</span><select id="usage">
      ${opt('all', 'Any', F.usage)}${opt('used', 'In use', F.usage)}${opt('never_used', 'Never used', F.usage)}${opt('no_data', 'No record', F.usage)}
    </select></span>
    <span class="pick off" title="The category pass has not run"><span class="lbl">Subject</span>
      <select disabled><option>Unassigned</option></select></span>
    <span class="grow"></span>
    <span class="tally">${n === ALL.length ? plural(n, 'card') : n + '/' + ALL.length}</span>
    <div class="modes" role="group" aria-label="Layout">
      <button data-mode="rows" aria-pressed="${F.mode === 'rows'}">Shelf list</button>
      <button data-mode="cards" aria-pressed="${F.mode === 'cards'}">Card deck</button>
    </div>
  </div>`;
}

// ---------------------------------------------------------------- rows
const COLS = [['call', 'Call no.'], ['name', 'Title'], ['age', 'Last used'],
              ['uses', 'Uses'], ['calls', 'Calls'], ['size', 'Lines']];

function sortBar() {
  return `<div class="controls" style="border-bottom:1px solid var(--rule-hair);padding-top:8px;padding-bottom:8px">
    <span class="lbl">Order by</span>
    ${COLS.map(([k, l]) => `<button class="swap" data-sort="${k}" style="border:0;background:none;
      color:${F.sort === k ? 'var(--ink)' : 'var(--ink-2)'};font-weight:${F.sort === k ? 600 : 400}">
      ${l}${F.sort === k ? (F.dir === 'asc' ? ' ↑' : ' ↓') : ''}</button>`).join('')}
  </div>`;
}

function rowsView(rows) {
  return sortBar() + `<div class="rows">${rows.map(e => {
    const on = F.open === e.id;
    const marks = [
      e.orchestration_verdict ? '<span class="mark-tag blue">orchestrator</span>' : '',
      isLeaf(e) ? '<span class="mark-tag ox">reached only via</span>' : '',
    ].filter(Boolean).join('');
    return `<div class="rec${on ? ' on' : ''}" data-id="${esc(e.id)}" tabindex="0"
        role="button" aria-expanded="${on}">
      <span class="call">${esc(call(e))}</span>
      <span class="ttl">${esc(e.name)}${marks ? `<span class="marks">${marks}</span>` : ''}</span>
      <span class="when">${ageText(e)}</span>
      <span class="abs">${esc(e.description || 'No abstract.')}</span>
    </div>${on ? cardOut(e) : ''}`;
  }).join('')}</div>`;
}

function cardOut(e) {
  const u = e.usage;
  const refs = list => list.length
    ? `<span class="refs">${list.map(x => `<span class="ref">${esc(x)}</span>`).join('')}</span>`
    : '<span style="color:var(--ink-3)">—</span>';
  const evidence = u.sources.length
    ? u.sources.map(s => {
        const n = u[s === 'tool_call' ? 'tool_calls' : s === 'injection' ? 'injections' : 'slash_commands'];
        return `${{tool_call: 'called as a tool', injection: 'injected by a hook', slash_command: 'typed as a command'}[s]} ×${n}`;
      }).join(' · ')
    : `nothing found in ${u.coverage === 'full_history' ? '167 days of command history' : 'the 30-day transcript window'}`;
  const notes = [
    e.has_resources && 'bundles resources', !e.model_invocable && 'not model-invocable',
    e.repo_differs && 'repo copy has drifted', e.parse_status !== 'ok' && 'frontmatter ' + e.parse_status,
    e.is_symlink && 'symlinked',
  ].filter(Boolean);

  return `<div class="card-out"><div class="card-in">
    <p class="quote">${esc(e.description || 'No abstract on file.')}</p>
    <dl>
      <dt>Call</dt><dd class="path">/${esc(e.id)}</dd>
      <dt>Shelved at</dt><dd class="path">${esc(e.skill_file)}</dd>
      <dt>Author</dt><dd>${esc(e.author)} <span style="color:var(--ink-3)">via ${esc(e.author_source)}</span></dd>
      <dt>Edition</dt><dd>${e.version ? esc(e.version) : '<span style="color:var(--ink-3)">unknown</span>'}
        ${e.updated_at ? ', ' + esc(e.updated_at.slice(0, 10)) : ''}</dd>
      ${e.upstream_url ? `<dt>Source</dt><dd class="path">${esc(e.upstream_url)}</dd>` : ''}
    </dl>
    <dl>
      <dt>Record</dt><dd>${WORD[state(e)]}${u.total_count != null ? `, ${plural(u.total_count, 'use')}` : ''}</dd>
      <dt>Evidence</dt><dd>${esc(evidence)}</dd>
      ${u.attribution === 'ambiguous' ? `<dt>Caveat</dt><dd>Shares its count with
        ${refs(u.attribution_candidates.filter(c => c !== e.id))} — hook injections name it without a
        plugin prefix, so the number cannot be split.</dd>` : ''}
      <dt>Calls</dt><dd>${refs(e.delegates_to)}</dd>
      <dt>Called by</dt><dd>${refs(e.reached_via)}</dd>
      ${e.delegates_to_unresolved.length ? `<dt>Unresolved</dt><dd>${refs(e.delegates_to_unresolved)}</dd>` : ''}
      <dt>Notes</dt><dd>${notes.length ? esc(notes.join(' · ')) : '<span style="color:var(--ink-3)">—</span>'}</dd>
    </dl>
  </div></div>`;
}

// ---------------------------------------------------------------- deck
function deckView(rows) {
  return `<div class="deck">${rows.map(e => `<article class="idx" data-id="${esc(e.id)}"
      tabindex="0" role="button" aria-label="${esc(e.name)}">
    <div class="bar"><span class="call">${esc(call(e))}</span>
      <span class="age">${age(e) == null ? WORD[state(e)] : (age(e) === 0 ? 'today' : age(e) + 'd')}</span></div>
    <h3>${esc(e.name)}</h3>
    <p>${esc(e.description || 'No abstract on file.')}</p>
    <div class="foot">
      <span class="mark-tag">${esc(ORIGIN(e))}</span>
      ${e.orchestration_verdict ? '<span class="mark-tag blue">orchestrator</span>' : ''}
      ${isLeaf(e) ? '<span class="mark-tag ox">reached only via</span>' : ''}
      <span class="uses">${e.usage.total_count != null ? plural(e.usage.total_count, 'use') : 'no record'}</span>
    </div></article>`).join('')}</div>`;
}

function none() {
  return `<div class="none"><h2>Nothing on that shelf</h2>
    <p>${F.q ? `No card mentions “${esc(F.q)}”` : 'No card matches those filters'}.
      Abstracts are the trigger text, so searching them finds more than titles alone.</p>
    <button id="reset">Reset the drawer</button></div>`;
}

// ---------------------------------------------------------------- render
function render(focus) {
  const rows = ordered(pool());
  document.getElementById('rail').innerHTML = rail();
  document.getElementById('sheet').innerHTML = head() + controls(rows.length) +
    (rows.length ? (F.mode === 'rows' ? rowsView(rows) : deckView(rows)) : none());
  document.getElementById('note').textContent =
    `${SNAP.counts.uncategorized} cards carry no subject heading yet — the category pass has not run.`;
  wire();
  if (focus) {
    const el = document.getElementById(focus.id);
    if (el) { el.focus(); if (focus.pos != null && el.setSelectionRange) el.setSelectionRange(focus.pos, focus.pos); }
  }
}

function wire() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on('q', 'input', e => { F.q = e.target.value; F.open = null; render({ id: 'q', pos: e.target.selectionStart }); });
  on('wide', 'change', e => { F.wide = e.target.checked; render({ id: 'wide' }); });
  on('usage', 'change', e => { F.usage = e.target.value; render({ id: 'usage' }); });
  on('reset', 'click', () => { F.q = ''; F.usage = 'all'; F.role = 'all'; F.letter = null; F.source = 'global'; render(); });

  document.querySelectorAll('[data-source]').forEach(b => b.addEventListener('click', () => {
    F.source = b.dataset.source; F.letter = null; F.open = null; render();
  }));
  document.querySelectorAll('[data-role]').forEach(b => b.addEventListener('click', () => {
    F.role = b.dataset.role; F.open = null; render();
  }));
  document.querySelectorAll('[data-letter]').forEach(b => b.addEventListener('click', () => {
    F.letter = b.dataset.letter || null; F.open = null; render();
  }));
  document.querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.sort;
    if (F.sort === k) F.dir = F.dir === 'asc' ? 'desc' : 'asc';
    else { F.sort = k; F.dir = ['call', 'name'].includes(k) ? 'asc' : 'desc'; }
    render();
  }));
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    if (F.mode === b.dataset.mode) return;
    F.mode = b.dataset.mode; F.open = null;
    const p = new URLSearchParams(location.search); p.set('mode', F.mode);
    history.replaceState(null, '', location.pathname + '?' + p);
    render();
  }));
  document.querySelectorAll('[data-id]').forEach(el => {
    const toggle = () => {
      F.open = F.open === el.dataset.id ? null : el.dataset.id;
      if (F.mode === 'cards' && F.open) F.mode = 'rows';
      render();
    };
    el.addEventListener('click', toggle);
    el.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
    });
  });
}

addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === '/' && !typing) { e.preventDefault(); document.getElementById('q').focus(); }
  if (e.key === 'Escape') {
    if (F.open) { F.open = null; render(); }
    else if (F.q) { F.q = ''; render({ id: 'q' }); }
  }
});

render();
</script>
</body>
</html>
